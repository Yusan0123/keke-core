services:
  - type: web
    name: keke-core
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: API_KEY
        sync: false
      - key: API_BASE_URL
        value: https://tk.transfig.cn/
      - key: MODEL_NAME
        value: claude-sonnet-4-6
