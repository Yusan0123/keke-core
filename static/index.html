<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>克克</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      height: 100dvh;
      overflow: hidden;
    }

    /* ── 登录页 ── */
    #login-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100dvh;
      gap: 16px;
    }
    #login-screen h1 { font-size: 22px; font-weight: 600; letter-spacing: 0.05em; }
    #login-screen p { font-size: 13px; color: #555; }
    #login-input {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 12px 18px;
      color: #f0f0f0;
      font-size: 16px;
      width: 260px;
      outline: none;
      text-align: center;
    }
    #login-input:focus { border-color: #2f6bff; }
    #login-btn {
      background: #2f6bff;
      border: none;
      border-radius: 12px;
      padding: 12px 40px;
      color: white;
      font-size: 15px;
      cursor: pointer;
      width: 260px;
    }
    #login-error { font-size: 13px; color: #c0504d; min-height: 18px; }

    /* ── 主界面 ── */
    #app {
      display: none;
      flex-direction: column;
      height: 100dvh;
      position: relative;
    }

    /* header */
    #header {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #1a1a1a;
      background: #0f0f0f;
      flex-shrink: 0;
    }
    #drawer-btn {
      background: none;
      border: none;
      color: #888;
      font-size: 20px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
      line-height: 1;
    }
    #drawer-btn:hover { color: #f0f0f0; background: #1e1e1e; }
    #header-title { font-size: 17px; font-weight: 600; flex: 1; }
    #pending-badge {
      background: #2f6bff;
      color: white;
      font-size: 11px;
      border-radius: 10px;
      padding: 2px 7px;
      display: none;
    }

    /* 聊天区 */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .bubble {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 18px;
      line-height: 1.55;
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .user { align-self: flex-end; background: #2f6bff; color: white; border-bottom-right-radius: 4px; }
    .assistant { align-self: flex-start; background: #1e1e1e; color: #f0f0f0; border-bottom-left-radius: 4px; }
    .thinking { opacity: 0.45; font-style: italic; }
    .role-label { font-size: 11px; color: #444; margin-bottom: 2px; }
    .msg-wrap { display: flex; flex-direction: column; }
    .msg-wrap.user { align-items: flex-end; }
    .msg-wrap.assistant { align-items: flex-start; }

    /* 输入区 */
    #input-area {
      padding: 10px 12px;
      border-top: 1px solid #1a1a1a;
      display: flex;
      gap: 8px;
      background: #0f0f0f;
      flex-shrink: 0;
    }
    #input {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 20px;
      padding: 10px 16px;
      color: #f0f0f0;
      font-size: 15px;
      outline: none;
      resize: none;
      max-height: 120px;
      line-height: 1.4;
    }
    #input:focus { border-color: #2f6bff; }
    #send {
      background: #2f6bff;
      border: none;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      cursor: pointer;
      font-size: 18px;
      color: white;
      flex-shrink: 0;
      align-self: flex-end;
    }
    #send:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ── 抽屉遮罩 ── */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 10;
    }
    #overlay.open { display: block; }

    /* ── 抽屉 ── */
    #drawer {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: min(320px, 85vw);
      background: #111;
      border-right: 1px solid #222;
      z-index: 20;
      display: flex;
      flex-direction: column;
      transform: translateX(-100%);
      transition: transform 0.25s cubic-bezier(.4,0,.2,1);
    }
    #drawer.open { transform: translateX(0); }

    #drawer-header {
      padding: 16px 16px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e1e1e;
      flex-shrink: 0;
    }
    #drawer-header h2 { font-size: 16px; font-weight: 600; }
    #drawer-close {
      background: none; border: none; color: #666;
      font-size: 20px; cursor: pointer; line-height: 1;
    }
    #drawer-refresh {
      background: none; border: 1px solid #2a2a2a;
      color: #666; border-radius: 7px;
      padding: 4px 10px; font-size: 12px; cursor: pointer;
    }
    #drawer-refresh:hover { color: #ccc; border-color: #444; }

    #diary-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .diary-empty { color: #444; font-size: 13px; text-align: center; margin-top: 50px; }

    .diary-card {
      background: #181818;
      border: 1px solid #252525;
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: opacity 0.3s;
    }
    .diary-meta { font-size: 11px; color: #484848; }
    .diary-trigger {
      font-size: 12px; color: #555; font-style: italic;
      padding-left: 8px; border-left: 2px solid #2a2a2a;
      line-height: 1.4;
    }
    .diary-content { font-size: 14px; color: #ddd; line-height: 1.55; }
    .diary-actions { display: flex; gap: 6px; justify-content: flex-end; }
    .btn-approve {
      background: #0e2a0e; border: 1px solid #1e4a1e;
      color: #4caf50; border-radius: 7px;
      padding: 5px 12px; font-size: 12px; cursor: pointer;
    }
    .btn-approve:hover { background: #142a14; }
    .btn-delete {
      background: #2a0e0e; border: 1px solid #4a1e1e;
      color: #e57373; border-radius: 7px;
      padding: 5px 12px; font-size: 12px; cursor: pointer;
    }
    .btn-delete:hover { background: #3a1414; }

    /* ── 手机端触摸滑动 ── */
    @media (hover: none) {
      #drawer-btn { display: none; } /* 手机靠滑 */
    }
  </style>
</head>
<body>

<!-- 登录页 -->
<div id="login-screen">
  <h1>克克 🌿</h1>
  <p>请输入密码</p>
  <input id="login-input" type="password" placeholder="密码" autocomplete="current-password">
  <div id="login-error"></div>
  <button id="login-btn">进入</button>
</div>

<!-- 主界面 -->
<div id="app">
  <div id="header">
    <button id="drawer-btn" title="克克的日记">☰</button>
    <span id="header-title">克克 🌿</span>
    <span id="pending-badge">0</span>
  </div>

  <div id="messages"></div>

  <div id="input-area">
    <textarea id="input" rows="1" placeholder="说点什么…"></textarea>
    <button id="send">↑</button>
  </div>
</div>

<!-- 抽屉遮罩 -->
<div id="overlay"></div>

<!-- 日记抽屉 -->
<div id="drawer">
  <div id="drawer-header">
    <h2>克克的日记</h2>
    <div style="display:flex;gap:8px;align-items:center">
      <button id="drawer-refresh">↻</button>
      <button id="drawer-close">✕</button>
    </div>
  </div>
  <div id="diary-list"></div>
</div>

<script>
// ── 登录 ──────────────────────────────────────────────
const loginScreen = document.getElementById('login-screen');
const appEl = document.getElementById('app');
const loginInput = document.getElementById('login-input');
const loginBtn = document.getElementById('login-btn');
const loginError = document.getElementById('login-error');

async function tryLogin() {
  const pwd = loginInput.value.trim();
  if (!pwd) return;
  loginBtn.disabled = true;
  loginError.textContent = '';
  try {
    const res = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pwd })
    });
    if (res.ok) {
      loginScreen.style.display = 'none';
      appEl.style.display = 'flex';
      loadHistory();
      loadDiary();
    } else {
      loginError.textContent = '密码不对，再试试';
    }
  } catch { loginError.textContent = '连接失败'; }
  loginBtn.disabled = false;
}

loginBtn.addEventListener('click', tryLogin);
loginInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });

// 检查是否已有session
async function checkSession() {
  try {
    const res = await fetch('/pending');
    if (res.ok) {
      loginScreen.style.display = 'none';
      appEl.style.display = 'flex';
      loadHistory();
      loadDiary();
    }
  } catch {}
}
checkSession();

// ── 抽屉 ─────────────────────────────────────────────
const drawer = document.getElementById('drawer');
const overlay = document.getElementById('overlay');

function openDrawer() {
  drawer.classList.add('open');
  overlay.classList.add('open');
  loadDiary();
}
function closeDrawer() {
  drawer.classList.remove('open');
  overlay.classList.remove('open');
}

document.getElementById('drawer-btn').addEventListener('click', openDrawer);
document.getElementById('drawer-close').addEventListener('click', closeDrawer);
document.getElementById('drawer-refresh').addEventListener('click', loadDiary);
overlay.addEventListener('click', closeDrawer);

// 手机端触摸滑动打开
let touchStartX = 0;
document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (touchStartX < 30 && dx > 60) openDrawer();
  if (drawer.classList.contains('open') && dx < -60) closeDrawer();
}, { passive: true });

// ── 聊天 ─────────────────────────────────────────────
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');

function addBubble(role, text) {
  const wrap = document.createElement('div');
  wrap.className = `msg-wrap ${role}`;
  const bubble = document.createElement('div');
  bubble.className = `bubble ${role}`;
  bubble.textContent = text;
  wrap.appendChild(bubble);
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return bubble;
}

async function loadHistory() {
  try {
    const res = await fetch('/history');
    if (!res.ok) return;
    const history = await res.json();
    messagesEl.innerHTML = '';
    const recent = history.slice(-20);
    recent.forEach(h => addBubble(h.role === 'user' ? 'user' : 'assistant', h.content));
  } catch {}
}

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  inputEl.style.height = 'auto';
  sendBtn.disabled = true;

  addBubble('user', text);
  const thinking = addBubble('assistant', '…');
  thinking.classList.add('thinking');

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    if (res.status === 401) {
      appEl.style.display = 'none';
      loginScreen.style.display = 'flex';
      return;
    }
    const data = await res.json();
    thinking.classList.remove('thinking');
    thinking.textContent = data.reply;
    // 有新内容时悄悄刷新badge
    setTimeout(refreshBadge, 2000);
  } catch {
    thinking.textContent = '连接出问题了，刷新试试';
  }

  sendBtn.disabled = false;
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

sendBtn.addEventListener('click', send);
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = inputEl.scrollHeight + 'px';
});

// ── 日记 ─────────────────────────────────────────────
async function loadDiary() {
  const list = document.getElementById('diary-list');
  list.innerHTML = '<div class="diary-empty">加载中…</div>';
  try {
    const res = await fetch('/pending');
    const items = await res.json();
    renderDiary(items);
    updateBadge(items.length);
  } catch {
    list.innerHTML = '<div class="diary-empty">加载失败</div>';
  }
}

function renderDiary(items) {
  const list = document.getElementById('diary-list');
  if (!items.length) {
    list.innerHTML = '<div class="diary-empty">克克暂时没有想记的 🌿</div>';
    return;
  }
  list.innerHTML = '';
  [...items].reverse().forEach(item => {
    const card = document.createElement('div');
    card.className = 'diary-card';
    card.dataset.id = item.id;
    card.innerHTML = `
      <div class="diary-meta">${item.timestamp}</div>
      ${item.trigger ? `<div class="diary-trigger">"${escHtml(item.trigger)}"</div>` : ''}
      <div class="diary-content">${escHtml(item.content)}</div>
      <div class="diary-actions">
        <button class="btn-delete" onclick="deleteDiary('${item.id}',this)">不用存</button>
        <button class="btn-approve" onclick="approveDiary('${item.id}',this)">存入记忆 ✓</button>
      </div>`;
    list.appendChild(card);
  });
}

async function approveDiary(id, btn) {
  btn.disabled = true; btn.textContent = '存入中…';
  try {
    await fetch('/pending/approve', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id })
    });
    const card = btn.closest('.diary-card');
    card.style.opacity = '0.25';
    setTimeout(() => { card.remove(); refreshBadge(); }, 500);
  } catch { btn.textContent = '失败'; btn.disabled = false; }
}

async function deleteDiary(id, btn) {
  btn.disabled = true;
  try {
    await fetch('/pending/delete', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id })
    });
    const card = btn.closest('.diary-card');
    card.style.opacity = '0.25';
    setTimeout(() => { card.remove(); refreshBadge(); }, 300);
  } catch { btn.disabled = false; }
}

function refreshBadge() {
  const cards = document.querySelectorAll('.diary-card').length;
  updateBadge(cards);
}
function updateBadge(n) {
  const badge = document.getElementById('pending-badge');
  if (n > 0) { badge.style.display = 'inline'; badge.textContent = n; }
  else { badge.style.display = 'none'; }
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
