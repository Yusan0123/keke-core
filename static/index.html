<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>克克</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── tabs ── */
    #tabs {
      display: flex;
      border-bottom: 1px solid #222;
      background: #0f0f0f;
    }
    .tab {
      flex: 1;
      padding: 14px;
      text-align: center;
      font-size: 14px;
      color: #888;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
    }
    .tab.active {
      color: #f0f0f0;
      border-bottom-color: #2f6bff;
    }

    /* ── panels ── */
    .panel { flex: 1; display: none; flex-direction: column; overflow: hidden; }
    .panel.active { display: flex; }

    /* ── chat panel ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 18px;
      line-height: 1.5;
      font-size: 15px;
      white-space: pre-wrap;
    }
    .user {
      align-self: flex-end;
      background: #2f6bff;
      color: white;
      border-bottom-right-radius: 4px;
    }
    .assistant {
      align-self: flex-start;
      background: #1e1e1e;
      color: #f0f0f0;
      border-bottom-left-radius: 4px;
    }
    .thinking { opacity: 0.5; font-style: italic; }
    #input-area {
      padding: 12px 16px;
      border-top: 1px solid #222;
      display: flex;
      gap: 8px;
      background: #0f0f0f;
    }
    #input {
      flex: 1;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 10px 16px;
      color: #f0f0f0;
      font-size: 15px;
      outline: none;
      resize: none;
      max-height: 120px;
    }
    #input:focus { border-color: #2f6bff; }
    #send {
      background: #2f6bff;
      border: none;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      cursor: pointer;
      font-size: 18px;
      color: white;
      flex-shrink: 0;
      align-self: flex-end;
    }
    #send:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── diary panel ── */
    #diary-list {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .diary-empty {
      color: #555;
      font-size: 14px;
      text-align: center;
      margin-top: 60px;
    }
    .diary-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .diary-meta {
      font-size: 12px;
      color: #555;
    }
    .diary-trigger {
      font-size: 13px;
      color: #666;
      font-style: italic;
      padding-left: 10px;
      border-left: 2px solid #333;
    }
    .diary-content {
      font-size: 15px;
      color: #e8e8e8;
      line-height: 1.6;
    }
    .diary-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    .btn-approve {
      background: #1a3a1a;
      border: 1px solid #2d6a2d;
      color: #5cb85c;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-approve:hover { background: #223a22; }
    .btn-delete {
      background: #2a1a1a;
      border: 1px solid #5a2d2d;
      color: #c0504d;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-delete:hover { background: #3a2020; }
    #diary-refresh {
      margin: 12px 20px 0;
      background: transparent;
      border: 1px solid #333;
      color: #888;
      border-radius: 8px;
      padding: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    #diary-refresh:hover { border-color: #555; color: #ccc; }
  </style>
</head>
<body>

  <div id="tabs">
    <div class="tab active" data-tab="chat">对话</div>
    <div class="tab" data-tab="diary" id="diary-tab">克克的日记</div>
  </div>

  <!-- 对话面板 -->
  <div class="panel active" id="panel-chat">
    <div id="messages"></div>
    <div id="input-area">
      <textarea id="input" rows="1" placeholder="说点什么…"></textarea>
      <button id="send">↑</button>
    </div>
  </div>

  <!-- 日记面板 -->
  <div class="panel" id="panel-diary">
    <button id="diary-refresh">↻ 刷新</button>
    <div id="diary-list"></div>
  </div>

  <script>
    // ── tab 切换 ──
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(`panel-${tab.dataset.tab}`).classList.add('active');
        if (tab.dataset.tab === 'diary') loadDiary();
      });
    });

    // ── 对话 ──
    const messages = document.getElementById('messages');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    function addBubble(role, text) {
      const div = document.createElement('div');
      div.className = `bubble ${role}`;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    async function send() {
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      input.style.height = 'auto';
      sendBtn.disabled = true;

      addBubble('user', text);
      const thinking = addBubble('assistant', '…');
      thinking.classList.add('thinking');

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        thinking.classList.remove('thinking');
        thinking.textContent = data.reply;
      } catch (e) {
        thinking.textContent = '连接出问题了，刷新试试';
      }

      sendBtn.disabled = false;
      messages.scrollTop = messages.scrollHeight;
    }

    sendBtn.addEventListener('click', send);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = input.scrollHeight + 'px';
    });

    // ── 日记 ──
    async function loadDiary() {
      const list = document.getElementById('diary-list');
      list.innerHTML = '<div class="diary-empty">加载中…</div>';
      try {
        const res = await fetch('/pending');
        const items = await res.json();
        renderDiary(items);
        // 更新tab徽标
        const tab = document.getElementById('diary-tab');
        tab.textContent = items.length > 0 ? `克克的日记 (${items.length})` : '克克的日记';
      } catch (e) {
        list.innerHTML = '<div class="diary-empty">加载失败，刷新试试</div>';
      }
    }

    function renderDiary(items) {
      const list = document.getElementById('diary-list');
      if (!items.length) {
        list.innerHTML = '<div class="diary-empty">克克暂时没有想记的东西 🌿</div>';
        return;
      }
      // 倒序显示，最新的在上面
      list.innerHTML = '';
      [...items].reverse().forEach(item => {
        const card = document.createElement('div');
        card.className = 'diary-card';
        card.dataset.id = item.id;
        card.innerHTML = `
          <div class="diary-meta">${item.timestamp}</div>
          ${item.trigger ? `<div class="diary-trigger">"${item.trigger}"</div>` : ''}
          <div class="diary-content">${item.content}</div>
          <div class="diary-actions">
            <button class="btn-delete" onclick="deleteDiary('${item.id}', this)">不用存</button>
            <button class="btn-approve" onclick="approveDiary('${item.id}', this)">存入长期记忆 ✓</button>
          </div>
        `;
        list.appendChild(card);
      });
    }

    async function approveDiary(id, btn) {
      btn.disabled = true;
      btn.textContent = '存入中…';
      try {
        await fetch('/pending/approve', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id })
        });
        btn.closest('.diary-card').style.opacity = '0.3';
        setTimeout(() => { btn.closest('.diary-card').remove(); updateDiaryCount(); }, 600);
      } catch (e) {
        btn.textContent = '失败了，再试试';
        btn.disabled = false;
      }
    }

    async function deleteDiary(id, btn) {
      btn.disabled = true;
      try {
        await fetch('/pending/delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id })
        });
        btn.closest('.diary-card').style.opacity = '0.3';
        setTimeout(() => { btn.closest('.diary-card').remove(); updateDiaryCount(); }, 400);
      } catch (e) {
        btn.disabled = false;
      }
    }

    function updateDiaryCount() {
      const remaining = document.querySelectorAll('.diary-card').length;
      const tab = document.getElementById('diary-tab');
      tab.textContent = remaining > 0 ? `克克的日记 (${remaining})` : '克克的日记';
      if (remaining === 0) {
        document.getElementById('diary-list').innerHTML =
          '<div class="diary-empty">克克暂时没有想记的东西 🌿</div>';
      }
    }

    document.getElementById('diary-refresh').addEventListener('click', loadDiary);
  </script>
</body>
</html>
